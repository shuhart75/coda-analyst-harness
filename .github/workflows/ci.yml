name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Evaluate clean analytical project
        run: |
          project="$(mktemp -d)/project"
          bash scripts/scaffold-project.sh "$project"
          python scripts/evaluate-harness.py "$project"
