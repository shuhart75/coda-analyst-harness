name: SDD adapter portability
on:
  push:
  pull_request:
jobs:
  adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check pinned runtime adapter without access to private repository
        run: python -m unittest discover -s tests -p test_sdd_adapter.py -v
