name: GigaCode SDD portability

on:
  push:
  pull_request:

jobs:
  portable:
    name: SDD (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test native paths, processes, locks and SDD orchestration
        working-directory: tools/gigacode-sdd
        run: python -m unittest discover -v
