name: GigaCode SDD portability

on:
  push:
  pull_request:

jobs:
  portable:
    name: SDD (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, shard: 0, shards: 1}
          - {os: macos-latest, shard: 0, shards: 1}
          - {os: windows-latest, shard: 0, shards: 3}
          - {os: windows-latest, shard: 1, shards: 3}
          - {os: windows-latest, shard: 2, shards: 3}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      SDD_TEST_SHARD: ${{ matrix.shard }}
      SDD_TEST_SHARDS: ${{ matrix.shards }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test native paths, processes, locks and SDD orchestration
        working-directory: tools/gigacode-sdd
        shell: bash
        run: |
          python - <<'PY'
          import os
          import unittest

          def cases(suite):
              for test in suite:
                  if isinstance(test, unittest.TestSuite):
                      yield from cases(test)
                  else:
                      yield test

          tests = list(cases(unittest.defaultTestLoader.discover('.')))
          shard = int(os.environ['SDD_TEST_SHARD'])
          shards = int(os.environ['SDD_TEST_SHARDS'])
          selected = tests[shard::shards]
          print(f'Shard {shard + 1}/{shards}: {len(selected)}/{len(tests)} tests', flush=True)
          if not selected:
              raise SystemExit('Empty test shard')
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(selected))
          raise SystemExit(not result.wasSuccessful())
          PY
